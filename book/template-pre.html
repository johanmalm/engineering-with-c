body {

	margin: auto;
	text-align: justify;

	font-weight: bold;
}

h1 {

}

}

h3 {
	font-size: 95%;
}

h4 {

	font-style: italic;
}

h5 {
	font-size: 90%;

}

dt code {
	font-weight: bold;
}

dd p {
	margin-top: 0;

a, a:visited {
	color: var(--color-link);
	text-decoration: none;
}

a:hover {
	text-decoration: underline;
}

a.perma {
	display: none;
}
a.perma:hover {
	text-decoration: none;
}
:hover > a.perma {
	width: 1.5em;
	margin-left: -1.5em;
	display: inline-block;
}

:target {
	background-color: rgba(128, 128, 128, 0.2);
}

.LOC {
	margin: 2em 0;
}
